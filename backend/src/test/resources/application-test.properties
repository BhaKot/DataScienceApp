# Test Profile Configuration - Following AlloSoft Pattern
# Uses SQLite in-memory database (jdbc:sqlite:file:UUID?mode=memory&cache=shared)

# Database Configuration
spring.datasource.url=jdbc:sqlite:file:testdb?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC

# Test Profile Configuration - Uses SQLite in-memory database
# Enable Liquibase for tests (schema created by Liquibase)
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
