# Production Profile Configuration

# Database - SQLite (Production)
spring.datasource.url=jdbc:sqlite:/var/app/data/app-prod.db
spring.datasource.driverClassName=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Logging
logging.level.root=INFO
logging.level.com.learn=INFO
logging.level.org.springframework.web=WARN
logging.level.org.liquibase=INFO

# Feature Flags - Conservative defaults for production
feature.batches-tab.enabled=false
feature.advanced-dashboard.enabled=false
feature.export-csv.enabled=false
