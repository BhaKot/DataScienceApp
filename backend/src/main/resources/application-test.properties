# Test Profile Configuration

# Database - Use SQLite in-memory for tests (matching AlloCore pattern)
# Uses unique UUID filename with mode=memory&cache=shared
spring.datasource.url=jdbc:sqlite:file:testdb?mode=memory&cache=shared
spring.datasource.driverClassName=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Liquibase - Disable for tests (schema created by Hibernate)
spring.liquibase.enabled=false

# Logging
logging.level.root=INFO
logging.level.com.learn=DEBUG
