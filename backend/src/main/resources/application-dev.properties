# Development Profile Configuration

# Database - SQLite (File-based for development)
spring.datasource.url=jdbc:sqlite:data/app-dev.db
spring.datasource.driverClassName=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Logging
logging.level.root=DEBUG
logging.level.com.learn=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.liquibase=DEBUG

# Feature Flags - All enabled for development
feature.batches-tab.enabled=true
feature.advanced-dashboard.enabled=true
feature.export-csv.enabled=true
