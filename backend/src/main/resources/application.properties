# DataScienceApp - Default Configuration
# For environment-specific overrides, use application-{profile}.properties

# Application
spring.application.name=data-science-app
spring.profiles.active=dev

# Server
server.port=8080
server.servlet.context-path=/

# Database (SQLite)
spring.datasource.url=jdbc:sqlite:data/app.db
spring.datasource.driverClassName=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=


# JPA / Hibernate (commented out)

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Logging
logging.level.root=INFO
logging.level.com.learn=DEBUG
logging.level.org.springframework.web=DEBUG

# Feature Flags (default: enabled for development)
feature.batches-tab.enabled=true
feature.advanced-dashboard.enabled=true
feature.export-csv.enabled=true
